<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNA — English Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #060B16;
  --s1:       rgba(255,255,255,0.035);
  --s2:       rgba(255,255,255,0.06);
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);
  --blue:     #5B8EF8;
  --blue2:    #3B6EDE;
  --purple:   #9B72FF;
  --green:    #22D3A0;
  --red:      #F43F5E;
  --text:     #EEF4FF;
  --muted:    rgba(190,215,255,0.52);
  --dim:      rgba(140,175,235,0.32);
  --r:        14px;
  --rl:       22px;
  --t:        0.22s cubic-bezier(0.4,0,0.2,1);
  --tb:       0.38s cubic-bezier(0.34,1.56,0.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  overflow:hidden;
  position:relative;
}

/* ─── MESH BACKGROUND ─── */
.mesh{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.mb{position:absolute;border-radius:50%;filter:blur(110px)}
.mb1{width:700px;height:700px;background:radial-gradient(circle,rgba(50,100,255,.1),transparent 65%);top:-250px;left:-150px;animation:m1 22s ease-in-out infinite}
.mb2{width:550px;height:550px;background:radial-gradient(circle,rgba(140,60,255,.09),transparent 65%);bottom:-180px;right:-120px;animation:m2 28s ease-in-out infinite}
.mb3{width:420px;height:420px;background:radial-gradient(circle,rgba(0,200,140,.05),transparent 65%);top:45%;left:42%;transform:translate(-50%,-50%);animation:m3 19s ease-in-out infinite}
@keyframes m1{0%,100%{transform:translate(0,0)}33%{transform:translate(70px,-80px)}66%{transform:translate(-50px,60px)}}
@keyframes m2{0%,100%{transform:translate(0,0)}33%{transform:translate(-80px,60px)}66%{transform:translate(60px,-70px)}}
@keyframes m3{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(calc(-50% - 60px),calc(-50% - 50px))}}

/* ─── CONTAINER ─── */
.app{
  position:relative;z-index:1;
  display:flex;width:100%;max-width:1020px;
  height:90vh;max-height:760px;
  background:rgba(6,11,22,0.7);
  backdrop-filter:blur(40px) saturate(1.6);
  -webkit-backdrop-filter:blur(40px) saturate(1.6);
  border:1px solid var(--border);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.06);
}

/* ─── LEFT PANEL ─── */
.left{
  width:284px;min-width:284px;
  display:flex;flex-direction:column;
  background:rgba(0,0,0,.25);
  border-right:1px solid var(--border);
  position:relative;overflow:hidden;
}

/* Logo bar */
.logo-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 18px 0;
  flex-shrink:0;
}
.logo{
  font-family:'Syne',sans-serif;
  font-size:18px;font-weight:800;
  letter-spacing:.04em;color:var(--text);
  display:flex;align-items:center;gap:6px;
}
.logo-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 8px var(--blue);
  animation:ldot 2.5s ease-in-out infinite;
}
@keyframes ldot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.xp-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border2);
  border-radius:100px;
  padding:4px 10px;
  font-size:11px;font-weight:700;
  color:var(--text);
}
.xp-star{font-size:12px}

/* Avatar zone */
.avatar-zone{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  flex:1;min-height:0;
  padding:10px;
}
#pCanvas{position:absolute;inset:0;pointer-events:none}
.avatar-wrap{
  position:relative;z-index:1;
  width:164px;height:164px;
  animation:afloat 4s ease-in-out infinite;
}
@keyframes afloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.a-glow{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(91,142,248,.18) 0%,transparent 65%);animation:aglow 3s ease-in-out infinite}
@keyframes aglow{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
.a-ring{
  position:absolute;inset:-16px;border-radius:50%;
  border:1px solid rgba(91,142,248,.22);
  animation:aring 11s linear infinite;
}
.a-ring::before{
  content:'';position:absolute;top:14px;left:-4px;
  width:8px;height:8px;border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 12px var(--blue),0 0 24px rgba(91,142,248,.5);
}
.a-ring2{
  position:absolute;inset:-28px;border-radius:50%;
  border:1px solid rgba(155,114,255,.14);
  animation:aring 18s linear infinite reverse;
}
.a-ring2::before{
  content:'';position:absolute;bottom:16px;right:-4px;
  width:5px;height:5px;border-radius:50%;
  background:var(--purple);
  box-shadow:0 0 8px var(--purple);
}
@keyframes aring{to{transform:rotate(360deg)}}
.a-svg{position:relative;z-index:1;width:100%;height:100%;filter:drop-shadow(0 0 20px rgba(91,142,248,.42))}
.eye-g{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,88%,100%{transform:scaleY(1)}94%{transform:scaleY(0.04)}}

/* Bubble */
.bubble-wrap{flex-shrink:0;padding:0 16px 14px}
.bubble{
  background:var(--s1);
  backdrop-filter:blur(12px);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:11px 13px;
  font-size:12.5px;color:var(--text);
  line-height:1.55;text-align:center;
  min-height:48px;display:flex;align-items:center;justify-content:center;
  position:relative;transition:all .3s ease;
}
.bubble::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-bottom-color:var(--border2);border-top:none}
.bubble::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:rgba(6,11,22,.9);border-top:none}

/* Tabs */
.tabs{
  flex-shrink:0;
  position:relative;
  display:flex;
  gap:0;
  background:rgba(0,0,0,.3);
  padding:5px;
  margin:0 14px 12px;
  border-radius:12px;
  border:1px solid var(--border);
}
.tab-pill{
  position:absolute;
  background:rgba(91,142,248,.18);
  border:1px solid rgba(91,142,248,.32);
  border-radius:9px;
  transition:all .28s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  z-index:0;
}
.tab{
  flex:1;position:relative;z-index:1;
  padding:8px 4px;
  border:none;border-radius:9px;cursor:pointer;
  font-size:11px;font-weight:600;
  background:transparent;color:var(--dim);
  transition:color .2s;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.ti{font-size:14px}
.tab:hover{color:var(--muted)}
.tab.on{color:var(--blue)}

/* Levels */
.lvl-zone{flex-shrink:0;padding:0 14px 18px}
.lvl-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.lvl-btns{display:flex;gap:5px}
.lvl-btn{flex:1;padding:7px 4px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:10.5px;font-weight:600;background:transparent;color:var(--muted);transition:all .2s;font-family:inherit}
.lvl-btn.on{border-color:var(--purple);background:rgba(155,114,255,.12);color:var(--purple)}

/* ─── RIGHT PANEL ─── */
.right{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}

/* Panel transition wrapper */
.panel{display:none;flex:1;flex-direction:column;min-height:0;animation:pfade .3s ease-out}
.panel.active{display:flex}
@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Panel header */
.ph{
  padding:16px 22px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.ph-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--text)}
.ph-sub{font-size:12px;color:var(--muted);margin-top:2px}
.ph-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(34,211,160,.08);
  border:1px solid rgba(34,211,160,.22);
  border-radius:100px;padding:4px 11px;
  font-size:11px;color:var(--green);font-weight:600;white-space:nowrap;
}
.ph-dot{width:5px;height:5px;background:var(--green);border-radius:50%;animation:ldot 2s ease-in-out infinite}

/* ─── CHAT ─── */
.msgs{
  flex:1;overflow-y:auto;
  padding:18px 20px;
  display:flex;flex-direction:column;gap:14px;
  scroll-behavior:smooth;
}
.msg-row{display:flex;align-items:flex-end;gap:9px;animation:min .28s ease-out}
.msg-row.user{flex-direction:row-reverse}
@keyframes min{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-av{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-size:11px;font-weight:800;
  color:white;flex-shrink:0;
  box-shadow:0 0 12px rgba(91,142,248,.3);
}
.msg{
  max-width:72%;
  padding:12px 16px;border-radius:18px;
  font-size:14px;line-height:1.6;word-wrap:break-word;
}
.msg-row.luna .msg{
  background:var(--s2);
  border:1px solid var(--border);
  color:var(--text);
  border-bottom-left-radius:4px;
}
.msg-row.user .msg{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:white;
  border-bottom-right-radius:4px;
  box-shadow:0 4px 18px rgba(91,142,248,.28);
}
.tr{font-size:11px;margin-top:6px;font-style:italic;color:var(--muted)}
.msg-row.user .tr{color:rgba(255,255,255,.6)}

/* Typing */
.msg-row.typing-row .msg{padding:14px 16px;display:flex;gap:5px;align-items:center}
.dot{width:7px;height:7px;background:var(--blue);border-radius:50%;animation:td 1.2s infinite;opacity:.5}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

/* Input */
.inp-area{
  padding:14px 18px;
  border-top:1px solid var(--border);
  display:flex;gap:9px;flex-shrink:0;
  background:rgba(0,0,0,.2);
  align-items:center;
}
.inp{
  flex:1;padding:13px 18px;
  border:1px solid var(--border2);
  border-radius:100px;
  font-size:14px;font-family:inherit;
  background:var(--s1);
  color:var(--text);outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
  backdrop-filter:blur(8px);
}
.inp::placeholder{color:var(--dim)}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,142,248,.12);background:rgba(255,255,255,.04)}
.inp.listening{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(244,63,94,.12)!important}

/* Mic & Send */
.icon-btn{
  width:46px;height:46px;border-radius:50%;border:1px solid var(--border2);
  background:var(--s1);color:var(--muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;font-family:inherit;
  backdrop-filter:blur(8px);
}
.icon-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(91,142,248,.08)}
.icon-btn.send-btn{background:linear-gradient(135deg,var(--blue),var(--purple));border:none;color:white;box-shadow:0 4px 14px rgba(91,142,248,.3)}
.icon-btn.send-btn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(91,142,248,.4)}
.icon-btn.send-btn:active{transform:scale(.95)}
.mic-active{border-color:var(--red)!important;color:var(--red)!important;background:rgba(244,63,94,.1)!important;animation:mpulse 1s ease-in-out infinite}
@keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.4)}50%{box-shadow:0 0 0 10px rgba(244,63,94,0)}}

/* ─── PANEL BODY ─── */
.panel-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ─── VOCAB ─── */
.vcat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.vcat-h{padding:12px 15px;background:rgba(91,142,248,.07);border-bottom:1px solid var(--border);font-weight:700;font-size:13px;color:var(--blue)}
.vwords{padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vword{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;transition:border-color .2s}
.vword:hover{border-color:var(--border2)}
.wen{font-weight:700;color:var(--text);font-size:13px;display:flex;align-items:center;gap:5px}
.wit{font-size:11px;color:var(--muted)}
.speak-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:0;line-height:1;opacity:.55;transition:opacity .2s,transform .15s}
.speak-btn:hover{opacity:1;transform:scale(1.2)}

/* ─── PHRASES ─── */
.ph-item{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:5px;transition:border-color .2s,background .2s}
.ph-item:hover{border-color:var(--border2);background:var(--s2)}
.ph-en{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.ph-it{font-size:13px;color:var(--muted)}
.ph-ctx{font-size:11px;color:var(--purple);font-style:italic}

/* ─── QUIZ ─── */
.quiz-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 20px;border-bottom:1px solid var(--border);
  flex-shrink:0;font-size:12px;color:var(--muted);
  background:rgba(0,0,0,.2);
}
.quiz-top strong{color:var(--text)}
.quiz-stars{color:#FBBF24;letter-spacing:2px;font-size:14px}
.ex-wrap{padding:18px;overflow-y:auto;flex:1}
.exbox{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:24px}
.ex-prog{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-bottom:20px;overflow:hidden}
.ex-prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:2px;transition:width .4s ease}
.exq{font-size:16px;color:var(--text);margin-bottom:18px;font-weight:500;line-height:1.45}
.qnum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:rgba(91,142,248,.15);border-radius:50%;font-size:12px;font-weight:700;color:var(--blue);margin-right:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:13px 16px;border:1px solid var(--border2);border-radius:11px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s;background:rgba(0,0,0,.2);color:var(--text);text-align:left}
.opt:hover:not([disabled]){border-color:var(--blue);background:rgba(91,142,248,.09);transform:translateX(4px)}
.opt.ok{border-color:var(--green)!important;background:rgba(34,211,160,.1)!important;color:var(--green)!important}
.opt.no{border-color:var(--red)!important;background:rgba(244,63,94,.08)!important;color:#FF6B8A!important}
.next-btn{margin-top:16px;padding:11px 26px;background:linear-gradient(135deg,var(--blue),var(--purple));color:white;border:none;border-radius:100px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;display:none;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 14px rgba(91,142,248,.28)}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(91,142,248,.38)}
.done-box{text-align:center;padding:44px 20px}
.done-emoji{font-size:56px;display:block;margin-bottom:12px}
.done-box h3{font-family:'Syne',sans-serif;font-size:26px;margin-bottom:8px;color:var(--text)}
.done-box p{font-size:14px;color:var(--muted);margin-bottom:24px}
.done-score{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;color:var(--blue);display:block;margin:6px 0 18px}
.restart{padding:13px 30px;background:linear-gradient(135deg,var(--blue),var(--purple));color:white;border:none;border-radius:100px;cursor:pointer;font-size:15px;font-family:inherit;font-weight:600;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 14px rgba(91,142,248,.28)}
.restart:hover{transform:scale(1.05)}

/* ─── XP POP ─── */
.xp-pop{position:fixed;font-size:13px;font-weight:700;color:var(--green);pointer-events:none;animation:xpfly 1.2s ease-out forwards;z-index:1000;text-shadow:0 0 10px var(--green)}
@keyframes xpfly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-55px) scale(.8)}}

/* ─── CORRECT FLASH ─── */
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(34,211,160,.5)}50%{box-shadow:0 0 0 16px rgba(34,211,160,0)}100%{box-shadow:0 0 0 0 rgba(34,211,160,0)}}
.flash{animation:flash .6s ease-out}

/* ─── RESPONSIVE ─── */
@media(max-width:700px){
  body{padding:0}
  .app{flex-direction:column;border-radius:0;height:100vh;max-height:100vh}
  .left{width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;gap:8px;padding:10px 12px;max-height:160px;overflow:hidden;border-right:none;border-bottom:1px solid var(--border)}
  .avatar-zone{flex:none;width:64px;height:64px;padding:0}
  .a-ring,.a-ring2,.a-glow{display:none}
  #pCanvas{display:none}
  .bubble-wrap{flex:1;padding:0;margin-left:8px}
  .bubble::before,.bubble::after{display:none}
  .logo-bar{width:100%}
  .tabs{margin:0;grid-column:1/-1;width:100%}
  .lvl-zone{width:100%;padding:0}
  .logo-dot{display:none}
}
@media(prefers-reduced-motion:reduce){
  .avatar-wrap,.a-ring,.a-ring2,.a-glow,.logo-dot,.ph-dot{animation:none}
  .msg-row,.opt,.panel{animation:none;transition:none}
}
</style>
</head>
<body>

<!-- MESH -->
<div class="mesh"><div class="mb mb1"></div><div class="mb mb2"></div><div class="mb mb3"></div></div>

<div class="app">

  <!-- ── LEFT ── -->
  <div class="left">

    <!-- Logo + XP -->
    <div class="logo-bar">
      <div class="logo"><div class="logo-dot"></div>LUNA ✦</div>
      <div class="xp-pill"><span class="xp-star">⭐</span><span id="xpTxt">0 XP</span></div>
    </div>

    <!-- XP track -->
    <div style="padding:10px 18px 0;flex-shrink:0">
      <div style="height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden">
        <div id="xpFill" style="height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:2px;width:0%;transition:width .5s cubic-bezier(.22,1,.36,1)"></div>
      </div>
    </div>

    <!-- Avatar zone -->
    <div class="avatar-zone">
      <canvas id="pCanvas"></canvas>
      <div class="avatar-wrap" id="aWrap">
        <div class="a-glow"></div>
        <div class="a-ring"></div>
        <div class="a-ring2"></div>
        <svg class="a-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="fg" cx="36%" cy="30%">
              <stop offset="0%" stop-color="#DDF0FF"/>
              <stop offset="50%" stop-color="#B8D8FF"/>
              <stop offset="100%" stop-color="#82B4E8"/>
            </radialGradient>
            <radialGradient id="bg2" cx="50%" cy="50%">
              <stop offset="0%" stop-color="rgba(91,142,248,0.35)"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
          <circle cx="80" cy="80" r="74" fill="url(#bg2)"/>
          <circle cx="80" cy="80" r="62" fill="url(#fg)"/>

// ── PARTICLES ─────────────────────────────────────────────────────────────
(function(){
  const canvas=document.getElementById('pCanvas');
  const zone=document.querySelector('.avatar-zone');
  if(!canvas||!zone)return;

  function resize(){
    canvas.width=zone.offsetWidth;
    canvas.height=zone.offsetHeight;
  }
  resize();
  window.addEventListener('resize',resize);

  const ctx=canvas.getContext('2d');
  const particles=[];
  const N=28;

  function cx(){return canvas.width/2}
  function cy(){return canvas.height/2}

  for(let i=0;i<N;i++){
    particles.push({
      angle:Math.random()*Math.PI*2,
      orbitR:80+Math.random()*38,
      speed:(Math.random()*.008+.004)*(Math.random()<.5?1:-1),
      size:Math.random()*2+.5,
      alpha:Math.random()*.55+.15,
      tw:Math.random()*Math.PI*2,
      tws:.04+Math.random()*.04,
      col:Math.random()<.6?[91,142,248]:[155,114,255]
    });
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const now=performance.now()*.001;
    particles.forEach(p=>{
      p.angle+=p.speed;
      p.tw+=p.tws;
      const x=cx()+Math.cos(p.angle)*p.orbitR;
      const y=cy()+Math.sin(p.angle)*p.orbitR*.42;
      const a=p.alpha*(0.4+0.6*Math.abs(Math.sin(p.tw)));
      ctx.beginPath();
      ctx.arc(x,y,p.size,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.col[0]},${p.col[1]},${p.col[2]},${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

}

const DEF=[
  {m:"Type any Italian word and I'll translate it! Try: 'grazie', 'ciao', 'mangiare'… 🇮🇹→🇬🇧",t:"Scrivi una parola italiana!"},
  {m:"'Practice makes perfect' — La pratica rende perfetti! Keep going! 💪",t:"Continua a praticare!"},
  {m:"Want to explore a topic? Type: food, family, weather, numbers, colors…",t:"Vuoi esplorare un argomento?"},
  {m:"Try introducing yourself: 'My name is ___, I'm from Italy, I like ___' 😊",t:"Presentati in inglese!"},
  {m:"Tip: think in English for simple daily things. 'I'm hungry.' 'It's cold.' 🧠",t:"Pensa in inglese quotidianamente!"}
];

// ── STATE ──────────────────────────────────────────────────────────────────
let level='beginner',qIdx=0,score=0,answered=false,talking=false;
let xp=parseInt(localStorage.getItem('luna_xp')||'0');

// ── XP ─────────────────────────────────────────────────────────────────────
function addXP(n,x,y){
  xp+=n;localStorage.setItem('luna_xp',xp);updateXP();
  const p=document.createElement('div');p.className='xp-pop';
  p.textContent=`+${n} XP`;p.style.cssText=`left:${x}px;top:${y}px`;
  document.body.appendChild(p);setTimeout(()=>p.remove(),1200);
}
function updateXP(){
  const f=Math.min((xp%100)/100*100,100);
  document.getElementById('xpFill').style.width=f+'%';
  document.getElementById('xpTxt').textContent=xp+' XP';
}

// ── SOUND ──────────────────────────────────────────────────────────────────
function playCorrect(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator();const g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.type='sine';o.frequency.setValueAtTime(523,ac.currentTime);
    o.frequency.setValueAtTime(659,ac.currentTime+.1);
    o.frequency.setValueAtTime(784,ac.currentTime+.2);
    g.gain.setValueAtTime(.2,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);
    o.start(ac.currentTime);o.stop(ac.currentTime+.5);
  }catch(e){}
}

// ── SPEECH SYNTH ───────────────────────────────────────────────────────────
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;u.pitch=1.05;speechSynthesis.speak(u)}

// ── AVATAR TALK ────────────────────────────────────────────────────────────
function startTalk(ms=2000){
  if(talking)return;talking=true;
  const m=document.getElementById('mouth');let open=false;
  const iv=setInterval(()=>{open=!open;m.setAttribute('d',open?'M63 116 Q80 131 97 116':'M63 116 Q80 122 97 116')},150);
  setTimeout(()=>{clearInterval(iv);m.setAttribute('d','M63 116 Q80 129 97 116');talking=false},ms);
}
function setBubble(t){document.getElementById('bubble').innerHTML=t}

// ── TABS ───────────────────────────────────────────────────────────────────
function switchTab(tab,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  movePill(btn);
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+tab).classList.add('active');
  const b={chat:"Let's practice! 💬 Write anything!",vocab:"New words! 📚 Click 🔊!",phrases:"Useful phrases! 🗣️ Listen & repeat!",exercises:"Quiz time! ✨ Good luck!"};
  setBubble(b[tab]);
  if(tab==='vocab')buildVocab();
  if(tab==='phrases')buildPhrases();
  if(tab==='exercises'){qIdx=0;score=0;updateScore();buildQuiz();}
}

function setLevel(lv,btn){
  level=lv;document.querySelectorAll('.lvl-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  buildVocab();buildPhrases();qIdx=0;score=0;updateScore();buildQuiz();
}

// ── VOCAB ──────────────────────────────────────────────────────────────────
function buildVocab(){
  const el=document.getElementById('vc');el.innerHTML='';
  (VOCAB[level]||VOCAB.beginner).forEach(cat=>{
    const d=document.createElement('div');d.className='vcat';
    d.innerHTML=`<div class="vcat-h">${cat.cat}</div><div class="vwords">${cat.words.map(w=>`<div class="vword"><div class="wen">${w.en}<button class="speak-btn" onclick="say('${w.en.replace(/'/g,"\\'")}')">🔊</button></div><div class="wit">${w.it}</div></div>`).join('')}</div>`;
    el.appendChild(d);
  });
}

// ── PHRASES ────────────────────────────────────────────────────────────────
function buildPhrases(){
  const el=document.getElementById('pc');el.innerHTML='';
  (PHRASES[level]||PHRASES.beginner).forEach(p=>{
    const d=document.createElement('div');d.className='ph-item';
    d.innerHTML=`<div class="ph-en">"${p.en}" <button class="speak-btn" onclick="say('${p.en.replace(/'/g,"\\'")}')">🔊</button></div><div class="ph-it">${p.it}</div><div class="ph-ctx">📌 ${p.ctx}</div>`;
    el.appendChild(d);
  });
}

// ── QUIZ ───────────────────────────────────────────────────────────────────
function updateScore(){
  const data=QUIZ[level]||QUIZ.beginner;
  document.getElementById('qN').textContent=Math.min(qIdx+1,data.length);
  document.getElementById('qT').textContent=data.length;
  document.getElementById('qStars').textContent='⭐'.repeat(Math.min(score,5));
  document.getElementById('qScore').textContent=score;
}
function buildQuiz(){
  const el=document.getElementById('exc');const data=QUIZ[level]||QUIZ.beginner;
  if(qIdx>=data.length){
    const pct=Math.round(score/data.length*100);
    const e=pct===100?'🏆':pct>=70?'🌟':'💪';
    const msg=pct===100?'Perfetto! Straordinario!':pct>=70?'Molto bene! Continua!':'Continua a praticare!';
    el.innerHTML=`<div class="done-box"><span class="done-emoji">${e}</span><h3>Completato!</h3><span class="done-score">${score}/${data.length}</span><p>${msg}</p><button class="restart" onclick="qIdx=0;score=0;updateScore();buildQuiz()">Ricomincia 🔄</button></div>`;
    return;
  }
  answered=false;const q=data[qIdx];const prog=(qIdx/data.length*100).toFixed(0);
  el.innerHTML=`<div class="exbox"><div class="ex-prog"><div class="ex-prog-fill" style="width:${prog}%"></div></div><div class="exq"><span class="qnum">${qIdx+1}</span>${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="checkAns(${i},${q.ok})">${o}</button>`).join('')}</div><button class="next-btn" id="nb" onclick="qIdx++;buildQuiz();updateScore()">Prossima →</button></div>`;
}
function checkAns(sel,ok){
  if(answered)return;answered=true;
  const btns=document.querySelectorAll('.opt');btns.forEach(b=>b.setAttribute('disabled',''));
  btns[ok].classList.add('ok');
  if(sel===ok){
    score++;setBubble("Correct! 🎉 Excellent!");startTalk(1500);
    btns[ok].classList.add('flash');
    playCorrect();
    const r=btns[ok].getBoundingClientRect();addXP(10,r.left+r.width/2,r.top);
  }else{
    btns[sel].classList.add('no');setBubble("Non è esatto! 😊 La risposta verde è quella giusta.");startTalk(1200);
  }
  updateScore();document.getElementById('nb').style.display='inline-block';
}

// ── CHAT ───────────────────────────────────────────────────────────────────
function send(){
  const inp=document.getElementById('inp');const txt=inp.value.trim();if(!txt)return;
  addMsg(txt,'user');inp.value='';
  addXP(2,window.innerWidth/2,window.innerHeight*.8);
  const row=document.createElement('div');row.className='msg-row luna typing-row';row.id='tp';
  row.innerHTML='<div class="msg-av">L</div><div class="msg"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  document.getElementById('msgs').appendChild(row);scrollMsgs();
  setTimeout(()=>{
    document.getElementById('tp')?.remove();
    const r=getReply(txt.toLowerCase());
    addMsg(r.m,'luna',r.t);startTalk();setBubble(r.m.substring(0,60)+(r.m.length>60?'…':''));
  },700+Math.random()*500);
}
function getReply(txt){
  for(const[k,v]of Object.entries(IT)){if(txt.includes(k))return{m:`"${k}" in English: <strong>"${v.en}"</strong> 🇬🇧\n\n${v.l}`,t:'Tradotto!'}}
  for(const r of RS){if(r.tr.some(t=>txt.includes(t)))return r.rs[Math.floor(Math.random()*r.rs.length)]}
  const en=['the ','is ','are ','i ','you ','he ','she ','we ','have','do ','can ','will '];
  if(en.some(w=>txt.includes(w)))return[
    {m:"Great English! 👏 Your sentences are improving! Add more detail — keep going!",t:"Ottimo inglese!"},
    {m:"Well done! 🌟 I understood you perfectly! Can you say more?",t:"Bravo! Ti ho capito!"},
    {m:"Excellent! 😊 Try: 'My name is ___, I'm from Italy, I enjoy ___'",t:"Eccellente!"}
  ][Math.floor(Math.random()*3)];
  return DEF[Math.floor(Math.random()*DEF.length)];
}
function addMsg(txt,who,tr=''){
  const row=document.createElement('div');row.className=`msg-row ${who}`;
  const av=document.createElement('div');av.className='msg-av';av.textContent=who==='luna'?'L':'Tu';
  if(who==='user'){av.style.background='rgba(255,255,255,0.15)';av.style.color='white';av.style.boxShadow='none'}
  const msg=document.createElement('div');msg.className='msg';
  msg.innerHTML=txt.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  if(tr)msg.innerHTML+=`<div class="tr">🇮🇹 ${tr}</div>`;
  row.appendChild(av);row.appendChild(msg);
  document.getElementById('msgs').appendChild(row);scrollMsgs();
}
function scrollMsgs(){const m=document.getElementById('msgs');m.scrollTop=m.scrollHeight}

// ── SPEECH RECOGNITION ─────────────────────────────────────────────────────
let recognition=null,isListening=false;
function toggleMic(){
  if(isListening){stopMic();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addMsg("Riconoscimento vocale non disponibile. Usa <strong>Google Chrome</strong> per parlare con me! 🎤",'luna');return;}
  recognition=new SR();
  recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=true;
  const inp=document.getElementById('inp'),btn=document.getElementById('micBtn');
  isListening=true;btn.classList.add('mic-active');
  inp.classList.add('listening');inp.placeholder='Ti ascolto… parla in inglese! 🎤';
  setBubble("Ti ascolto! 🎤<br><em>Parla in inglese…</em>");
  recognition.onresult=e=>{
    const t=Array.from(e.results).map(r=>r[0].transcript).join('');
    inp.value=t;
    if(e.results[e.results.length-1].isFinal){stopMic();setTimeout(()=>send(),350);}
  };
  recognition.onerror=e=>{
    stopMic();
    if(e.error==='not-allowed')addMsg("Microfono bloccato! Vai nelle impostazioni del browser e consenti il microfono. 🎤",'luna');
    else if(e.error==='no-speech')setBubble("Non ho sentito nulla… riprova! 🎤");
  };
  recognition.onend=()=>{if(isListening)stopMic();};
  recognition.start();
}
function stopMic(){
  isListening=false;
  document.getElementById('micBtn').classList.remove('mic-active');
  const inp=document.getElementById('inp');
  inp.classList.remove('listening');inp.placeholder='Scrivi o parla…';
  if(recognition){try{recognition.stop();}catch(e){}recognition=null;}
}

// ── INIT ───────────────────────────────────────────────────────────────────
buildVocab();buildPhrases();buildQuiz();updateXP();

setTimeout(()=>{
  addMsg("Ciao! 👋 Sono <strong>Luna</strong> ✦ la tua AI English Tutor!",'luna',"Hi! I'm Luna, your English tutor!");
  startTalk(2000);
},400);
setTimeout(()=>{
  addMsg("Sono qui per aiutarti a parlare inglese in modo naturale! 🇬🇧\n\n• Scrivi qualsiasi <strong>parola italiana</strong> → la traduco\n• Chatta con me in italiano o in inglese\n• Usa il <strong>microfono</strong> 🎤 per praticare la pronuncia\n• Esplora <strong>Vocaboli</strong>, <strong>Frasi</strong> e il <strong>Quiz</strong>\n• Guadagna <strong>XP</strong> ad ogni risposta giusta! ⭐\n\nCominciamo — come si dice <em>'ciao'</em> in inglese? 😊",'luna',
  "Let's learn English together!");
},1900);
</script>
